{% extends "job_boardApp/base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h3>Job Seeker Sign Up</h3>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="full_name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Job Title / Role</label>
                <input type="text" name="jtitle" class="form-control" placeholder="e.g. IT Assistant">
                <div class="form-text">Your current or desired role</div>
            </div>
            <div class="mb-3">
                <label class="form-label">Skills</label>
                <input type="text" name="skills" class="form-control" placeholder="e.g. for Developer: Java, SQL and Python" required>
                <div class="form-text">Comma-separated. </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Location</label>
                <input type="text" name="location" class="form-control" placeholder="e.g. Harare" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Years of Experience</label>
                <input type="number" name="experience_years" class="form-control" min="0" value="0">
            </div>
            <button type="submit" class="btn btn-primary">Create Job Seeker Account</button>
        </form>
    </div>
</div>
{% endblock %}
