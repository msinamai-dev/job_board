<div id="pw-strength" class="mt-2">
    <div class="progress" style="height: 8px;">
        <div id="pw-bar" class="progress-bar" role="progressbar"
             style="width: 0%;" aria-valuemin="0" aria-valuemax="100"></div>
    </div>
    <div class="d-flex justify-content-between small mt-1">
        <span class="text-muted">Password strength</span>
        <strong id="pw-label"></strong>
    </div>
    
</div>

<script>
(function () {
    const input = document.querySelector('input[name="password"], input[name="new_password"]');
    const bar = document.getElementById("pw-bar");
    const label = document.getElementById("pw-label");
    const rules = document.querySelectorAll("#pw-rules li");
    if (!input || !bar) return;

    const tests = {
        length: (p) => p.length >= 10,
        lower:  (p) => /[a-z]/.test(p),
        upper:  (p) => /[A-Z]/.test(p),
        digit:  (p) => /\d/.test(p),
        symbol: (p) => /[^\w\s]/.test(p),
    };

    const levels = [
        { text: "",       cls: "",           width: 0 },
        { text: "Weak",   cls: "bg-danger",  width: 25 },
        { text: "Weak",   cls: "bg-danger",  width: 40 },
        { text: "Fair",   cls: "bg-warning", width: 60 },
        { text: "Good",   cls: "bg-info",    width: 80 },
        { text: "Strong", cls: "bg-success", width: 100 },
    ];

    function update() {
        const p = input.value;
        let score = 0;

        rules.forEach((li) => {
            const ok = tests[li.dataset.rule](p);
            if (ok) score++;
            li.textContent = (ok ? "\u2713 " : "\u2717 ") + li.textContent.slice(2);
            li.className = ok ? "text-success" : "text-muted";
        });

        const level = p.length === 0 ? levels[0] : levels[score];
        bar.className = "progress-bar " + level.cls;
        bar.style.width = level.width + "%";
        bar.setAttribute("aria-valuenow", level.width);
        label.textContent = level.text;
        label.className = level.cls ? "text-" + level.cls.replace("bg-", "") : "";

        // Block submitting until all five rules are met
        input.setCustomValidity(
            score === 5 ? "" : "Password does not meet all the requirements."
        );
    }

    // Prime the checklist symbols once, then update on every keystroke
    rules.forEach((li) => (li.textContent = "\u2717 " + li.textContent));
    input.addEventListener("input", update);
    update();
})();
</script>
