{% extends "job_boardApp/base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h3>Change Password</h3>
        {% if forced %}
        <div class="alert alert-warning small">
            Your current password is too weak. You must set a stronger one before using the site.
        </div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Current Password</label>
                <input type="password" name="current_password" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" name="new_password" class="form-control" required minlength="10"  pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^\w\s]).{10,}"
                       title="At least 10 characters with an uppercase letter, a lowercase letter, a number and a symbol">
                
            </div>
            <div class="mb-3">
                <label class="form-label">Confirm New Password</label>
                <input type="password" name="confirm_password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Change Password</button>
        </form>
    </div>
</div>
{% endblock %}
