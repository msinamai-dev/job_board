{% extends "job_boardApp/base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h3>Send Interview Invite</h3>
        <p class="text-muted">
            Inviting <strong>{{ match.job_seeker.full_name }}</strong> to interview for
            <strong>{{ match.job.title }}</strong>.
        </p>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Interview Date</label>
                <input type="date" name="interview_date" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Interview Time</label>
                <input type="time" name="interview_time" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Venue</label>
                <input type="text" name="venue" class="form-control" placeholder="e.g. Head Office, 4th Floor, Harare" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Note (optional)</label>
                <textarea name="note" class="form-control" rows="3" placeholder="e.g. Bring your ID and a printed CV"></textarea>
            </div>
            <button type="submit" class="btn btn-success">Send Invite</button>
        </form>
    </div>
</div>
{% endblock %}
