{% extends "job_boardApp/base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <h3>Post a Job</h3>
        <p class="text-muted">Once posted, we'll automatically match this job against every job seeker in the system and notify both sides.</p>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Job Title</label>
                <input type="text" name="title" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="4"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Required Skills</label>
                <input type="text" name="required_skills" class="form-control" placeholder="e.g. Python, Django, SQL" required>
                <div class="form-text">Comma-separated. Matched against candidate skills automatically.</div>
            </div>
            <div class="mb-3">
                <label class="form-label">Location</label>
                <input type="text" name="location" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Minimum Experience (years)</label>
                <input type="number" name="min_experience" class="form-control" min="0" value="0">
            </div>
            <div class="mb-3">
                <label class="form-label">Salary (optional)</label>
                <input type="text" name="salary" class="form-control" placeholder="e.g. $500 - $700/month">
            </div>
            <button type="submit" class="btn btn-success">Post Job & Start Matching</button>
        </form>
    </div>
</div>
{% endblock %}
